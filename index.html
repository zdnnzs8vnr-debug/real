  ["Come faccio a entrare nel portale?","Il nodo è privato. Serve la parola chiave, che viene distribuita ai contatti diretti. Una volta inserita, la sessione resta valida per tutta la durata della navigazione nella scheda: chiudendo il browser l'accesso scade e dovrai reinserirla."],

  ["Quanto tempo richiede la spedizione?","La preparazione richiede 24-48 ore. La spedizione avviene con POSTE ITALIANE, BRT, GLS, DHL o LOCKER INPOST, sempre tracciata. I tempi dipendono dal corriere e dalla destinazione."],
  ["Il mio ordine è andato storto, che faccio?","Apri Telegram e scrivi al contatto ufficiale allegando il codice ordine. Da lì completiamo o correggiamo la pratica in chat, senza passare da altri canali."],
  ["Perché il sito è a volte offline?","Perché siamo nati sul dark web e subiamo attacchi ricorrenti. Quando succede, l'infrastruttura viene ricostruita e il nodo torna online più solido. È parte della nostra storia, non un difetto."]

const Ctx = createContext(null);

const money = n => "€ " + Number(n).toLocaleString("it-IT");

/* ================= MEDIA BOX ================= */
function Img({src, fallbacks=[], alt="", ratio="16 / 10", zoom=false, onClick}){
  const list = useMemo(()=>[src,...fallbacks].filter(Boolean), [src, fallbacks.join("|")]);
  const [i,setI] = useState(0);
  useEffect(()=>{ setI(0); }, [src]);
  return (
    <div className={"mbox" + (zoom?" mzoom":"")} style={{aspectRatio:ratio}} onClick={onClick}>
      <img src={list[Math.min(i,list.length-1)]} alt={alt} loading="lazy" decoding="async"
        onError={()=>{ if(i<list.length-1) setI(i+1); }} />
    </div>
  );
}

/* ================= APP ================= */
function App(){
  const [lang,setLang]   = useState(()=> localStorage.getItem("ge-lang") || "it");
  const [route,setRoute] = useState(()=> window.location.hash.replace(/^#/,"") || "/boot");
  const [session,setSession] = useState(()=> sessionStorage.getItem("ge-in")==="1");
  const [cart,setCart]   = useState([]);
  const [cartOpen,setCartOpen] = useState(false);
  const [menuOpen,setMenuOpen] = useState(false);
  const [sid] = useState(()=> hex(8));

  useEffect(()=>{
    localStorage.setItem("ge-lang", lang);
    document.documentElement.lang = lang;
  }, [lang]);

  useEffect(()=>{
    const onHash = ()=>{
      const r = window.location.hash.replace(/^#/,"") || "/boot";
      setRoute(r); setMenuOpen(false);
      window.scrollTo(0,0);
    };
    window.addEventListener("hashchange", onHash);
    return ()=> window.removeEventListener("hashchange", onHash);
  }, []);

  const t = useCallback(k => {
    const d = DICT[lang] || DICT.it;
    return d[k] !== undefined ? d[k] : (DICT.it[k] !== undefined ? DICT.it[k] : k);
  }, [lang]);

  const arr = useCallback(k => {
    const d = DICT[lang] || DICT.it;
    return d[k] !== undefined ? d[k] : (DICT.it[k] || []);
  }, [lang]);

  const go = useCallback(r => { window.location.hash = "#" + r; }, []);

  const addToCart = useCallback(item => {
    setCart(p => {
      const f = p.find(x => x.id === item.id);
      if(f) return p.map(x => x.id === item.id ? {...x, qty:x.qty+1} : x);
      return [...p, {...item, qty:1}];
    });
    setCartOpen(true);
  }, []);
  const removeFromCart = useCallback(id => setCart(p => p.filter(x => x.id !== id)), []);
  const setQty = useCallback((id,q) => setCart(p => p.map(x => x.id===id ? {...x, qty:Math.max(1,q)} : x)), []);
  const clearCart = useCallback(()=> setCart([]), []);

  const cartCount = cart.reduce((s,x)=> s + x.qty, 0);
  const cartTotal = cart.reduce((s,x)=> s + x.qty * (x.transfer ? x.cost : x.price), 0);

  const ctx = {lang,setLang,t,arr,go,route,cart,addToCart,removeFromCart,setQty,clearCart,
    cartCount,cartTotal,cartOpen,setCartOpen,menuOpen,setMenuOpen,session,setSession,sid};

  const gateNeeded = route !== "/gate" && route !== "/boot" && !session;

  let page;
  if(route === "/boot") page = <Boot/>;
  else if(gateNeeded)   page = <Gate/>;
  else {
    const map = {
      "/gate":<Gate/>,"/node":<Home/>,"/cash":<Cash/>,"/paypal":<Paypal/>,"/quality":<Quality/>,
      "/feedback":<Feedback/>,"/faq":<Faq/>,"/track":<Track/>,
      "/privacy":<Legal which="privacy"/>,"/terms":<Legal which="terms"/>,"/cookies":<Legal which="cookies"/>,
      "/checkout":<Checkout/>
    };
    page = map[route] || <Home/>;
  }

  const shell = route !== "/boot";

  return (
    <Ctx.Provider value={ctx}>
      {/* LIVELLO 0 — sfondo, mai sopra il contenuto */}
      <div className="bgfx"></div>
      <div className="bgscan"></div>
      <div className="blob blob-a"></div>
      <div className="blob blob-b"></div>
      <div className="blob blob-c"></div>

      {/* LIVELLO 1 — contenuto */}
      <div className="shell">
        {shell && <Header/>}
        <main style={{flex:1}}>
          <div key={route} className="fade">{page}</div>
        </main>
        {shell && <Footer/>}
      </div>

      {/* LIVELLO 2 — UI flottante */}
      <CartDrawer/>
      {shell && <FAB/>}
    </Ctx.Provider>
  );
}

/* ================= TRACK ================= */
function Track(){
  const {t} = useApp();
  const [code,setCode] = useState("");
  const [found,setFound] = useState(null);
  const [searched,setSearched] = useState(false);
  const all = useMemo(()=> JSON.parse(localStorage.getItem("ge-orders") || "[]"), []);

  const search = ()=>{
    const o = all.find(x => x.code.toUpperCase() === code.trim().toUpperCase());
    setFound(o || null); setSearched(true);
  };

  return (
    <div className="sect">
      <div className="wrap" style={{maxWidth:680}}>
        <div className="eyebrow" style={{marginBottom:12}}>{t("track.kicker")}</div>
        <h1 style={{marginBottom:26}}>{t("track.title")}</h1>

        <div className="card pad">
          <label>{t("track.ph")}</label>
          <div className="row" style={{gap:10}}>
            <input value={code} onChange={e=>setCode(e.target.value)} placeholder="GST-1500-250-7K3F"
              style={{flex:1, minWidth:180}} autoCapitalize="characters" autoCorrect="off" spellCheck="false" />
            <button className="btn btn-gold" onClick={search}>{t("track.btn")}</button>
          </div>
        </div>

        {searched && !found && <div className="mono" style={{fontSize:12, color:"var(--rs)", marginTop:18}}>✕ {t("track.nf")}</div>}

        {found && (
          <div className="card pad" style={{marginTop:18}}>
            <div className="mono dim2" style={{fontSize:10.5}}>{t("co.order")}</div>
            <div className="mono" style={{fontSize:15, fontWeight:700, color:"var(--au)", marginBottom:14}}>{found.code}</div>
            <div className="mono dim2" style={{fontSize:10.5}}>{t("track.status")}</div>
            <div className="mono" style={{fontSize:13, color:"var(--tl)", marginBottom:14}}>{found.status}</div>
            <div className="mono dim2" style={{fontSize:10.5, marginBottom:8}}>{t("track.items")}</div>
            {found.items.map((it,i)=>(
              <div key={i} className="mono dim" style={{fontSize:12}}>{it.qty}× {it.name}</div>
            ))}
          </div>
        )}

        {!all.length && !searched && (
          <div className="mono dim2" style={{fontSize:11, marginTop:18}}>{t("track.empty")}</div>
        )}
      </div>
    </div>
  );
}

/* ================= CHECKOUT ================= */
function Checkout(){
  const {t,cart,cartTotal,clearCart,go} = useApp();
  const [step,setStep] = useState(0);
  const [f,setF] = useState({name:"",addr:"",city:"",zip:"",country:"",phone:"",prefix:"+39",carrier:CARRIERS[0],note:"",email:"",email2:""});
  const [method,setMethod] = useState("crypto");
  const [net,setNet] = useState("USDT");
  const [amazon,setAmazon] = useState("");
  const [order,setOrder] = useState(null);
  const [left,setLeft] = useState(30*60);
  const [copied,setCopied] = useState("");

  const onlyTransfers = cart.length>0 && cart.every(x=>x.transfer);
  const hasTransfers = cart.some(x=>x.transfer);

  useEffect(()=>{
    if(step!==2) return;
    const iv = setInterval(()=> setLeft(l => Math.max(0,l-1)), 1000);
    return ()=> clearInterval(iv);
  }, [step]);

  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email);
  const emailMatch = f.email !== "" && f.email === f.email2;
  const total = method==="sepa" ? Math.round(cartTotal*1.1) : method==="amazon" ? Math.round(cartTotal*1.2) : cartTotal;
  const mm = String(Math.floor(left/60)).padStart(2,"0");
  const ss = String(left%60).padStart(2,"0");

  const canNext = () => {
    if(step===0 && onlyTransfers) return emailOk && emailMatch;
    return true;
  };

  const confirm = ()=>{
    const tags = cart.map(i => i.transfer ? i.recv : i.price).join("-");
    const code = "GST-" + tags + "-" + rnd4();
    const rec = {code, status:"IN ATTESA DI PAGAMENTO", method,
      items: cart.map(i=>({name:i.name, qty:i.qty})), total, email:f.email, created:Date.now()};
    const all = JSON.parse(localStorage.getItem("ge-orders") || "[]");
    all.push(rec);
    localStorage.setItem("ge-orders", JSON.stringify(all));
    setOrder(rec); setStep(3); clearCart();
  };

  const copy = (txt,key)=>{
    try { navigator.clipboard.writeText(txt); } catch(e){}
    setCopied(key); setTimeout(()=>setCopied(""), 1400);
  };

  if(!cart.length && step<3){
    return (
      <div className="sect" style={{textAlign:"center"}}>
        <div className="wrap">
          <div className="mono dim" style={{fontSize:12, marginBottom:20}}>{t("co.empty")}</div>
          <button className="btn btn-gold" onClick={()=>go("/cash")}>{t("home.cta1")}</button>
        </div>
      </div>
    );
  }

  const STEPS = [t("co.step1"),t("co.step2"),t("co.step3"),t("co.step4")];

  return (
    <div className="sect">
      <div className="wrap" style={{maxWidth:820}}>
        <div className="row" style={{gap:8, marginBottom:26}}>
          {STEPS.map((s,i)=>(
            <span key={i} className="chip" style={step>=i ? {borderColor:"var(--au)", color:"var(--au)"} : {}}>{i+1}. {s}</span>
          ))}
        </div>

        {step===0 && (
          <div className="card pad">
            {onlyTransfers ? (
              <>
                <label>{t("co.email")}</label>
                <input value={f.email} onChange={e=>setF({...f,email:e.target.value})} placeholder="you@paypal.com"
                  type="email" autoCapitalize="none" autoCorrect="off" spellCheck="false" />
                {f.email && !emailOk && <div className="mono" style={{fontSize:11, color:"var(--rs)", marginTop:8}}>✕ {t("co.emailErr")}</div>}
                <div style={{height:16}}></div>
                <label>{t("co.email2")}</label>
                <input value={f.email2} onChange={e=>setF({...f,email2:e.target.value})} placeholder="you@paypal.com"
                  type="email" autoCapitalize="none" autoCorrect="off" spellCheck="false" />
                {f.email2 && !emailMatch && <div className="mono" style={{fontSize:11, color:"var(--rs)", marginTop:8}}>✕ {t("co.mismatch")}</div>}
              </>
            ) : (
              <div className="g2" style={{gap:14}}>
                <div style={{gridColumn:"1 / -1"}}><label>Nome</label><input value={f.name} onChange={e=>setF({...f,name:e.target.value})}/></div>
                <div style={{gridColumn:"1 / -1"}}><label>Indirizzo</label><input value={f.addr} onChange={e=>setF({...f,addr:e.target.value})}/></div>
                <div><label>Città</label><input value={f.city} onChange={e=>setF({...f,city:e.target.value})}/></div>
                <div><label>CAP</label><input value={f.zip} onChange={e=>setF({...f,zip:e.target.value})} inputMode="numeric"/></div>
                <div><label>Paese</label><input value={f.country} onChange={e=>setF({...f,country:e.target.value})}/></div>
                <div>
                  <label>Telefono</label>
                  <div className="row" style={{gap:8}}>
                    <select value={f.prefix} onChange={e=>setF({...f,prefix:e.target.value})} style={{width:96}}>
                      {PREFIXES.map(p=><option key={p}>{p}</option>)}
                    </select>
                    <input value={f.phone} onChange={e=>setF({...f,phone:e.target.value})} inputMode="tel" style={{flex:1}}/>
                  </div>
                </div>
                <div style={{gridColumn:"1 / -1"}}>
                  <label>Corriere</label>
                  <select value={f.carrier} onChange={e=>setF({...f,carrier:e.target.value})}>
                    {CARRIERS.map(c=><option key={c}>{c}</option>)}
                  </select>
                </div>
                <div style={{gridColumn:"1 / -1"}}><label>Note</label><input value={f.note} onChange={e=>setF({...f,note:e.target.value})}/></div>
                {hasTransfers && (
                  <>
                    <div style={{gridColumn:"1 / -1"}}><label>{t("co.email")}</label>
                      <input value={f.email} onChange={e=>setF({...f,email:e.target.value})} type="email" autoCapitalize="none"/>
                    </div>
                    <div style={{gridColumn:"1 / -1"}}><label>{t("co.email2")}</label>
                      <input value={f.email2} onChange={e=>setF({...f,email2:e.target.value})} type="email" autoCapitalize="none"/>
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        )}

        {step===1 && (
          <div className="card pad">
            <div className="eyebrow" style={{marginBottom:16}}>{t("co.summary")}</div>
            {cart.map(i=>(
              <div key={i.id} className="between mono" style={{fontSize:12.5, padding:"10px 0", borderBottom:"1px solid var(--line)"}}>
                <span>{i.qty}× {i.name}</span>
                <span style={{color:"var(--au)"}}>{money(i.qty * (i.transfer ? i.cost : i.price))}</span>
              </div>
            ))}
            <div className="between" style={{marginTop:16}}>
              <span className="mono dim" style={{fontSize:12}}>{t("common.total")}</span>
              <span className="mono" style={{fontWeight:700, color:"var(--au)", fontSize:16}}>{money(cartTotal)}</span>
            </div>
          </div>
        )}

        {step===2 && (
          <div className="card pad">
            <div className="eyebrow" style={{marginBottom:16}}>{t("co.payTitle")}</div>
            <div style={{display:"flex", flexDirection:"column", gap:10, marginBottom:22}}>
              {[["crypto","co.crypto"],["sepa","co.sepa"],["amazon","co.amazon"]].map(([k,kk])=>(
                <button key={k} onClick={()=>setMethod(k)} className="card flat pad"
                  style={{textAlign:"left", cursor:"pointer", background:"#090b14",
                    border: method===k ? "1px solid var(--au)" : "1px solid var(--line)", fontFamily:"inherit", color:"var(--fg)"}}>
                  <span style={{fontSize:13}}>{t(kk)}</span>
                </button>
              ))}
            </div>

            {method==="crypto" && (
              <div className="card flat pad">
                <div className="row" style={{gap:8, marginBottom:20}}>
                  {Object.keys(WALLETS).map(k=>(
                    <button key={k} className="btn btn-ghost btn-sm"
                      style={net===k ? {borderColor:"var(--au)", color:"var(--au)"} : {}}
                      onClick={()=>setNet(k)}>{WALLETS[k].label}</button>
                  ))}
                </div>
                <div className="g2" style={{gap:22, alignItems:"start"}}>
                  <div>
                    <label>{t("co.address")}</label>
                    <div className="mono dim" style={{fontSize:11, wordBreak:"break-all", marginBottom:18}}>{WALLETS[net].addr}</div>
                    <label>{t("co.amount")}</label>
                    <div className="mono" style={{fontSize:20, fontWeight:700, color:"var(--au)"}}>{money(cartTotal)}</div>
                    <div className="mono" style={{fontSize:11, marginTop:14, color:"var(--rs)"}}>
                      {t("co.countdown")}: {mm}:{ss}
                    </div>
                    <button className="btn btn-ghost btn-sm" style={{marginTop:14}}
                      onClick={()=>copy(WALLETS[net].addr,"addr")}>
                      {copied==="addr" ? t("common.copied") : t("co.copy")}
                    </button>
                  </div>
                  <div style={{display:"flex", justifyContent:"center"}}>
                    <img src={QR(WALLETS[net].addr)} alt="QR" width="200" height="200"
                      style={{borderRadius:12, border:"1px solid var(--line)", background:"#fff", padding:6}} />
                  </div>
                </div>
              </div>
            )}

            {method==="sepa" && (
              <div className="card flat pad">
                <div className="mono dim" style={{fontSize:12.5}}>{t("co.iban")}</div>
                <div className="mono" style={{fontSize:18, fontWeight:700, color:"var(--au)", marginTop:8}}>{money(total)}</div>
              </div>
            )}

            {method==="amazon" && (
              <div className="card flat pad">
                <label>{t("co.amazonPh")}</label>
                <input value={amazon} maxLength={15} inputMode="numeric"
                  onChange={e=>setAmazon(e.target.value.replace(/\D/g,""))} placeholder="000000000000000"/>
                <div className="mono dim2" style={{fontSize:11, marginTop:12}}>{money(total)}</div>
              </div>
            )}
          </div>
        )}

        {step===3 && order && (
          <div style={{display:"flex", flexDirection:"column", gap:16}}>
            <div className="card pad">
              <div className="eyebrow" style={{color:"var(--tl)", marginBottom:10}}>{t("co.reg")}</div>
              <div className="mono dim2" style={{fontSize:10.5}}>{t("co.order")}</div>
              <div className="mono" style={{fontSize:24, fontWeight:700, color:"var(--au)", wordBreak:"break-all"}}>{order.code}</div>
              <button className="btn btn-ghost btn-sm" style={{marginTop:16}} onClick={()=>copy(order.code,"code")}>
                {copied==="code" ? t("common.copied") : t("co.copy")}
              </button>
            </div>

            <div className="card pad" style={{borderColor:"rgba(255,92,92,.42)", background:"#140b10"}}>
              <div className="mono" style={{fontSize:13, fontWeight:700, color:"var(--rs)", marginBottom:10}}>{t("co.red.title")}</div>
              <p className="dim" style={{fontSize:13, marginBottom:18}}>{t("co.red.text")}</p>
              <a className="btn btn-gold" href={TG} target="_blank" rel="noopener noreferrer">{t("cash.tgBtn")}</a>
            </div>

            <button className="btn btn-ghost" onClick={()=>go("/track")} style={{alignSelf:"flex-start"}}>{t("nav.track")}</button>
          </div>
        )}

        {step<3 && (
          <div className="between" style={{marginTop:26}}>
            <button className="btn btn-ghost" disabled={step===0} onClick={()=>setStep(s=>Math.max(0,s-1))}>{t("co.back")}</button>
            {step<2
              ? <button className="btn btn-gold" disabled={!canNext()} onClick={()=>setStep(s=>s+1)}>{t("co.next")}</button>
              : <button className="btn btn-gold" onClick={confirm}>{t("co.done")}</button>}
          </div>
        )}
      </div>
    </div>
  );
}

/* ================= MOUNT ================= */
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
